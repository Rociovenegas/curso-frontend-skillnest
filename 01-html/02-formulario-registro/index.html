<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="r.venegasrojas.06@gmail.com">
    <title>Formulario Registro</title>
    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="./static/css/styles.css">
</head>

<body>
    <!-- Simple registration form (content in Spanish). 
     Main field IDs: firstName, lastName, email, password, confirmPassword,
  dateOfBirth, gender (male/female/notDefined), newsletter, userDescription, interests. -->
    <form>
        <fieldset class="personal-info">
            <h1>¡Regístrate y únete a la comunidad!</h1>
            <label for="firstName">Nombre:</label>
            <input type="text" id="firstName" name="firstName" class="form-group" required>

            <label for="lastName">Apellido:</label>
            <input type="text" id="lastName" name="lastName" class="form-group" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" class="form-group" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" class="form-group" required>

            <label for="confirmPassword">Confirmar Contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-group" required>

            <label for="dateOfBirth">Fecha de nacimiento:</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-group" required>

            <fieldset class="radio-group">
                <legend>Género:</legend>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Masculino</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Femenino</label>
                <input type="radio" id="notDefined" name="gender" value="not-defined">
                <label for="notDefined">Prefiero no decir</label>
            </fieldset>

            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Suscríbete a nuestro boletín de noticias</label>

            <label for="userDescription">Una descripción de mí mismo:</label>
            <textarea name="userDescription" id="userDescription" class="form-group"></textarea>

            <label for="interests">Selecciona tus intereses:</label>
            <select name="interests" id="interests" class="form-group">
                <option value="music">Música</option>
                <option value="sports">Deportes</option>
                <option value="trips">Viajes</option>
                <option value="technology">Tecnología</option>
            </select>

            <input type="submit" value="¡Registrarse!">
        </fieldset>

    </form>
    <script src="./static/js/script.js"></script>
</body>

</html>
